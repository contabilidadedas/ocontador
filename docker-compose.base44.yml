services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contador
      POSTGRES_PASSWORD: contadorpass
      POSTGRES_DB: contadoronline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contador -d contadoronline"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://contador:contadorpass@db:5432/contadoronline
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx nodemon server.js"

volumes:
  pgdata:
