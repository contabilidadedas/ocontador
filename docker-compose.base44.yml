services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contador
      POSTGRES_PASSWORD: contadorpass
      POSTGRES_DB: contadoronline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contador -d contadoronline"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://contador:contadorpass@db:5432/contadoronline
      - DATABASE_SSL=false
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && ./node_modules/.bin/nodemon server.js"

volumes:
  pgdata:
